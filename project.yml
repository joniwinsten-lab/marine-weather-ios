# XcodeGen — run: xcodegen generate (requires full Xcode for build)
name: MarineWeather
options:
  bundleIdPrefix: fi.veneappi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  MapLibreNative:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    from: "6.24.0"
  CocoaMQTT:
    url: https://github.com/emqx/CocoaMQTT
    from: "2.1.8"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2" # iPhone + iPad (iPad-first UI; iPhone supported, polish later)
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
targets:
  MarineWeather:
    type: application
    platform: iOS
    sources:
      - path: MarineWeather/Sources
      - path: MarineWeather/Resources
      - path: MarineWeather/Assets.xcassets
      - path: MarineWeather/Configuration
        buildPhase: none
    dependencies:
      - package: MapLibreNative
        product: MapLibre
      - package: CocoaMQTT
        product: CocoaMQTT
      - package: CocoaMQTT
        product: CocoaMQTTWebSocket
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fi.veneappi.MarineWeather
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 5H7A83K4WU
        MARKETING_VERSION: "0.3.9"
        CURRENT_PROJECT_VERSION: "46"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Marine Weather
        INFOPLIST_KEY_CFBundleLocalizations: en fi sv nb
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.weather"
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Marine Weather uses your location while the app is open to centre the weather map on your position and load forecasts for that area—for example, when you tap recentre to see wind and temperature at your current sailing location."
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "Apple Development"
    info:
      path: MarineWeather/Resources/Info-additions.plist
    capabilities:
      inAppPurchase: true

schemes:
  MarineWeather:
    build:
      targets:
        MarineWeather: all
    run:
      config: Debug
      storeKitConfiguration: MarineWeather/Configuration/Products.storekit
      simulateLocation:
        - path: MarineWeather/Configuration/Helsinki.gpx
